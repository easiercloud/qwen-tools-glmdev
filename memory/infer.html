<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>推理显存建模</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light only;
      --bg: #f6f7f9;
      --ink: #16181d;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #3b5bcc;
      --sans: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f7f9; }
    body { color: var(--ink); font: 14px/1.5 var(--sans); background: var(--bg); }
    header {
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px 14px;
    }
    header a.home { color: var(--muted); text-decoration: none; font-size: 12px; letter-spacing: .04em; display: inline-block; margin-bottom: 6px; }
    header a.home:hover { color: var(--accent); }
    .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
    header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    header p a { color: var(--accent); text-decoration: none; }
    header p a:hover { text-decoration: underline; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
    .top-link {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 11px;
      border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: var(--ink);
      text-decoration: none; font: 600 12px/1 var(--sans);
    }
    .top-link:hover { border-color: var(--accent); color: var(--accent); }
    .top-link svg { width: 14px; height: 14px; }
    iframe {
      display: block; width: 100%; height: calc(100% - 108px);
      border: 0; background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <a class="home" href="../">← QWEN 小工具</a>
        <h1>推理显存建模</h1>
        <p>MoE 推理单卡规划 · 嵌入 <a href="https://eco-sphere.github.io/infer-memory-visualizer/" target="_blank" rel="noopener">Eco-Sphere Memory Planner</a></p>
      </div>
      <div class="top-actions">
        <a class="top-link" href="https://github.com/Eco-Sphere/infer-memory-visualizer" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
          GitHub
        </a>
        <a class="top-link" href="https://github.com/Eco-Sphere/infer-memory-visualizer/issues/new" target="_blank" rel="noopener noreferrer" aria-label="反馈问题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16.5" x2="12.01" y2="16.5"></line></svg>
          反馈
        </a>
      </div>
    </div>
  </header>
  <iframe
    src="https://eco-sphere.github.io/infer-memory-visualizer/"
    title="推理显存建模"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</body>
</html>
